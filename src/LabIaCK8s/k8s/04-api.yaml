apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
  namespace: iac-tutorialk8s
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalogo-api
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
        - name: api
          image: tutorialk8s-catalogo-api:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: Db__Password
              valueFrom:
                secretKeyRef:
                  name: banco-secrets
                  key: SA_PASSWORD
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-api
  namespace: iac-tutorialk8s
spec:
  type: ClusterIP
  selector:
    app: catalogo-api
  ports:
    - port: 80
      targetPort: http
